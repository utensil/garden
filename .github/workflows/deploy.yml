name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (bun)
        run: bun install

      # garden IS the Quartz fork, so build its own CLI — NOT `bunx quartz`,
      # which resolves to a globally-installed quartz and crashes on this config.
      - name: Build Quartz (local CLI via bun)
        run: bun ./quartz/bootstrap-cli.mjs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
